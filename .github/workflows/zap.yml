# Traqy · Test de sécurité du site en ligne avec OWASP ZAP (gratuit), en mode « baseline » :
# ZAP parcourt le site comme un visiteur et repère les faiblesses (en-têtes de sécurité, cookies, fuites d'informations).
# Il n'attaque rien : aucune requête destructrice, seulement de la lecture. Cible : notre propre site et notre moteur.
# Lancé quand ce fichier change, et à la demande (pas de passage automatique régulier). Rapport rangé dans la branche « rapports-zap »,
# qui porte un interface/vercel.json empêchant Vercel d'essayer de la mettre en ligne.
name: Sécurité du site en ligne (OWASP ZAP)

on:
  push:
    branches: [main]
    paths: [".github/workflows/zap.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Réveiller le moteur (offre gratuite de Render)
        run: curl -s -o /dev/null -m 120 https://traqy-api.onrender.com/ || true

      - name: Tester le site et le moteur
        run: |
          mkdir -p /tmp/zap && chmod 777 /tmp/zap
          for cible in "site https://traqy.vercel.app" "moteur https://traqy-api.onrender.com"; do
            set -- $cible
            docker run --rm -v /tmp/zap:/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable \
              zap-baseline.py -t "$2" -m 2 -J "zap-$1.json" -r "zap-$1.html" -I || true
          done
          ls -la /tmp/zap

      - name: Ranger le rapport dans la branche rapports-zap
        run: |
          mkdir -p /tmp/rapport/interface && cd /tmp/rapport
          cp /tmp/zap/zap-*.json /tmp/zap/zap-*.html . 2>/dev/null || true
          echo '{"git": {"deploymentEnabled": false}}' > interface/vercel.json
          git init -q && git checkout -q -b rapports-zap
          git config user.name "Traqy sécurité" && git config user.email "actions@github.com"
          git add . && git commit -q -m "Rapport ZAP du commit ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" rapports-zap
